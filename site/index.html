<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GR86 Watch</title>
<meta name="description" content="トヨタGR86・スバルBRZ・マツダ ロードスター(MX-5)に関する最新リリース・動画・SNS話題・メディア評価・お客様の声・モータースポーツ情報を30分おきに自動収集するモニタリングダッシュボード" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101114'/%3E%3Cpath d='M4 22 L13 8 L17 8 L8 22 Z' fill='%23eb0a1e'/%3E%3Cpath d='M15 22 L24 8 L28 8 L19 22 Z' fill='%23f5f5f2'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead__inner">
    <div class="masthead__brand">
      <div class="masthead__mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M5 30 L16 10 L21 10 L10 30 Z" fill="var(--accent)"/>
          <path d="M19 30 L30 10 L35 10 L24 30 Z" fill="currentColor" opacity="0.85"/>
        </svg>
      </div>
      <div class="masthead__title">
        <span class="masthead__eyebrow" id="eyebrow-text">GR86 / BRZ / MX-5 MONITORING</span>
        <h1>GR86 Watch</h1>
      </div>
    </div>
    <div class="masthead__controls">
      <div class="masthead__status">
        <div class="status-row">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="last-updated">…</span>
        </div>
        <div class="schedule-chips">
          <span class="chip" id="chip-cadence">30min</span>
          <span class="chip-label" id="chip-label">auto-update</span>
        </div>
      </div>
      <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-toggle__btn" data-lang="ja">JA</button>
        <button type="button" class="lang-toggle__btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>
  <div class="vehicle-filter" id="vehicle-filter" role="tablist"></div>
</header>

<section class="stats" id="stats" aria-label="summary"></section>

<main class="board" id="board">
  <p class="board__loading" id="loading">…</p>
</main>

<footer class="site-footer">
  <p id="footer-text"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
